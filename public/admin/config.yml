backend:
  name: github
  repo: farrosfr/strava
  branch: main

media_folder: public/uploads
public_folder: /strava/uploads

singletons:
  - name: manual_log
    label: Manual Log
    file: public/data/manual-log.json
    icon: list_alt
    fields:
      - label: Entries
        label_singular: Day
        name: entries
        widget: list
        summary: "{{fields.date}} - {{fields.pushUps}} push-ups"
        add_to_top: true
        collapsed: auto
        minimize_collapsed: auto
        fields:
          - label: Date
            name: date
            widget: datetime
            type: date
            default: "{{now}}"
          - label: Push-ups
            name: pushUps
            widget: number
            value_type: int
            min: 0
            default: 0
          - label: Other sport
            name: otherSport
            widget: string
            required: false
          - label: Other activity
            name: otherActivity
            widget: string
            required: false
